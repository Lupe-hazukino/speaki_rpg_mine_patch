name: Publish 1.2.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-1.2.0.yml
      - releases/Speaki_rpg_mine_patch-1.2.0.zip
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-1.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          EXPECTED = "b19ad0ee56943689011175364fd84aaad457adde77d14f0613fb54213af1e327"
          NAME = "Speaki_rpg_mine_patch-1.2.0.zip"
          TAG = "v1.2.0"
          REPO = os.environ["GH_REPO"]
          assert REPO == "Lupe-hazukino/speaki_rpg_mine_patch"
          COMMIT = os.environ["GH_COMMIT"]
          TOKEN = os.environ["GH_TOKEN"]
          BASE = "https://api.github.com/repos/" + REPO
          
          def request(method, url, data=None, binary=False):
              assert urllib.parse.urlsplit(url).hostname in {"api.github.com", "uploads.github.com"}
              headers = {
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/zip" if binary else "application/json",
                  "User-Agent": "Speaki-rpg-mine-patch-release",
              }
              body = data if binary else json.dumps(data).encode() if data is not None else None
              with urllib.request.urlopen(urllib.request.Request(url, data=body, headers=headers, method=method), timeout=60) as response:
                  return json.load(response)
          
          encoded = request("GET", BASE + "/contents/releases/" + NAME + "?ref=" + urllib.parse.quote(COMMIT, safe=""))
          assert encoded["encoding"] == "base64"
          payload = base64.b64decode(encoded["content"])
          assert hashlib.sha256(payload).hexdigest() == EXPECTED
          with zipfile.ZipFile(io.BytesIO(payload)) as package:
              assert package.testzip() is None
              assert len(package.namelist()) == 21
              assert all(name.startswith("Speaki_rpg_mine_patch/") for name in package.namelist())
              manifest = json.loads(package.read("Speaki_rpg_mine_patch/manifest.json"))
              assert manifest["version"] == "1.2.0"
              assert " 1.2.0 " in package.read("Speaki_rpg_mine_patch/README.txt").decode("utf-8").splitlines()[0]
          
          try:
              release = request("GET", BASE + "/releases/tags/" + TAG)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = request("POST", BASE + "/releases", {
                  "tag_name": TAG,
                  "target_commitish": COMMIT,
                  "name": "Speaki_rpg_mine_patch 1.2.0",
                  "body": "",
                  "draft": True,
                  "prerelease": False,
                  "generate_release_notes": False,
              })
          
          asset = next((item for item in release.get("assets", []) if item["name"] == NAME), None)
          if not release["draft"]:
              assert asset and asset["size"] == len(payload) and asset.get("digest") == "sha256:" + EXPECTED, "An existing published v1.2.0 differs; refusing to overwrite it"
          else:
              if asset:
                  assert asset["size"] == len(payload) and asset.get("digest") == "sha256:" + EXPECTED, "An existing draft asset differs; refusing to overwrite it"
              else:
                  upload = release["upload_url"].split("{", 1)[0]
                  asset = request("POST", upload + "?name=" + urllib.parse.quote(NAME), payload, binary=True)
                  assert asset["state"] == "uploaded" and asset["size"] == len(payload)
                  assert asset.get("digest") == "sha256:" + EXPECTED
              release = request("PATCH", BASE + "/releases/" + str(release["id"]), {
                  "name": "Speaki_rpg_mine_patch 1.2.0",
                  "body": "",
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })
          
          assert not release["draft"] and not release["prerelease"]
          print(json.dumps({"release": release["html_url"], "asset": asset["name"], "sha256": EXPECTED}))
          PY
