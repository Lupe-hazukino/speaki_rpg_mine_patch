name: Publish 1.3.2 and 1.3.2-Plus
on:
  push:
    branches: [release/nov28-1.3.2]
    paths: [release-staging/target.txt]
permissions:
  contents: write
concurrency:
  group: publish-nov28-1.3.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and publish tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "Lupe-hazukino/speaki_rpg_mine_patch"
          cd release-staging
          target=$(cat target.txt)
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          chrome=Speaki_rpg_mine_patch-1.3.2.zip
          plus=SpeakiCraft-Plus-1.3.2-Plus-Windows-patch.zip
          sha256sum -c checksums.txt
          unzip -tq "$chrome"
          unzip -tq "$plus"
          publish() {
            local tag="$1" zip="$2" title="$3" latest="$4" notes="$5"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --draft --target "$target" --title "$title" --notes "$notes"
            fi
            local state
            state=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [[ "$state" == true ]]; then
              if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx -- "$zip"; then
                gh release upload "$tag" "$zip"
              fi
              local check
              check=$(mktemp -d)
              gh release download "$tag" --pattern "$zip" --dir "$check"
              cmp "$zip" "$check/$zip"
              gh release edit "$tag" --draft=false --latest="$latest"
            fi
          }
          publish v1.3.2 "$chrome" 'Speaki_rpg_mine_patch 1.3.2' false '11月28日のゲーム本体更新に対応したChrome拡張版です。'
          publish v1.3.2-Plus "$plus" 'スピキクラフトMOD 1.3.2-Plus' true '11月28日のゲーム本体更新に対応したWindows Plus版です。'
